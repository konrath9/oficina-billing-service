apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
  namespace: oficina-mecanica
  labels:
    app: oficina-billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-billing-service
  template:
    metadata:
      labels:
        app: oficina-billing-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/konrath9/oficina-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-billing-config
            - secretRef:
                name: oficina-billing-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # /health inclui o banco e a conexao com o RabbitMQ (health check do MassTransit)
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
