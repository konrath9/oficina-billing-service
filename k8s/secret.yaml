# Secret de demonstracao (kind de CI / ambiente local). Em producao o CI gera este Secret
# a partir dos GitHub Secrets e este arquivo NAO e copiado para o k3s.
# MercadoPago__AccessToken vazio = gateway fake (pagamento confirmado via /simular).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-secrets
  namespace: oficina-mecanica
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres-billing;Port=5432;Database=oficina_billing;Username=postgres;Password=postgres"
  Jwt__SecretKey: "OficinaMecanica@SecretKey#2024!MustBe32CharsMin"
  RabbitMq__Password: "oficina123"
  MercadoPago__AccessToken: ""
  MercadoPago__NotificationUrl: ""
  NewRelic__LicenseKey: ""
