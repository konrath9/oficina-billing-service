# Postgres simples, SOMENTE para o cluster kind efemero do CI (sem volume persistente).
# Em producao o banco e o RDS (connection string vem do Secret gerado no deploy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-billing
  namespace: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-billing
  template:
    metadata:
      labels:
        app: postgres-billing
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: oficina_billing
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-billing
  namespace: oficina-mecanica
spec:
  selector:
    app: postgres-billing
  ports:
    - port: 5432
      targetPort: 5432
