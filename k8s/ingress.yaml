# Traefik (host unico): estes prefixos vao para o Billing; o resto continua no OS Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-billing-service
  namespace: oficina-mecanica
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/orcamentos
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  number: 8080
          - path: /api/pagamentos
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  number: 8080
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  number: 8080
