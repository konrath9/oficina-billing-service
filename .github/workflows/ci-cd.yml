name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oficina-billing-service
  NAMESPACE: oficina-mecanica
  DEPLOYMENT: oficina-billing-service

jobs:
  build-test:
    name: Build, testes (cobertura >= 80%) e SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud precisa do historico completo

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: SonarCloud - begin
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"konrath9_oficina-billing-service" \
            /o:"konrath9" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,OficinaBilling.Tests/**"

      - name: SonarCloud ignorado (secret SONAR_TOKEN ausente)
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN nao configurado - analise do SonarCloud pulada."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes com gate de cobertura (linhas >= 80%)
        run: >
          dotnet test --no-build -c Release
          /p:CollectCoverage=true
          /p:Threshold=80
          /p:ThresholdType=line
          /p:CoverletOutputFormat=opencover

      - name: SonarCloud - end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: OficinaBilling.Tests/coverage.opencover.xml
          if-no-files-found: ignore

  deploy-homologacao:
    name: Imagem no GHCR + deploy em cluster kind efemero
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # unico job que publica imagem no GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Criar cluster kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: oficina-billing-ci

      - name: Carregar imagem no kind
        run: |
          # o containerd do kind as vezes ainda nao esta pronto logo apos o cluster subir
          for i in 1 2 3 4 5; do
            kind load docker-image "$IMAGE_NAME:${{ github.sha }}" --name oficina-billing-ci && exit 0
            echo "Tentativa $i falhou, aguardando..."; sleep 10
          done
          exit 1

      - name: Dependencias (RabbitMQ do orquestrador + Postgres de CI)
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f https://raw.githubusercontent.com/konrath9/OficinaMecanica/master/k8s/rabbitmq.yaml
          kubectl apply -f k8s/ci/postgres.yaml
          kubectl rollout status deployment/postgres-billing -n "$NAMESPACE" --timeout=180s

      - name: Aplicar manifestos (imagem desta execucao)
        run: |
          sed -i "s|$IMAGE_NAME:.*|$IMAGE_NAME:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Aguardar rollout
        run: |
          if ! kubectl rollout status deployment/$DEPLOYMENT -n "$NAMESPACE" --timeout=300s; then
            kubectl get pods -n "$NAMESPACE"
            kubectl logs deployment/$DEPLOYMENT -n "$NAMESPACE" --tail=100 || true
            exit 1
          fi

      - name: Smoke test (Swagger)
        run: |
          kubectl port-forward svc/$DEPLOYMENT 8080:8080 -n "$NAMESPACE" &
          sleep 5
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors http://localhost:8080/billing/swagger/v1/swagger.json > /dev/null

  deploy-producao:
    name: Deploy no cluster k3s de producao
    runs-on: ubuntu-latest
    needs: deploy-homologacao
    permissions:
      contents: read
    env:
      K3S_HOST: ${{ secrets.K3S_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Configurar chave SSH do node k3s
        env:
          K3S_SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_PRIVATE_KEY" > ~/.ssh/k3s_ec2_key
          chmod 600 ~/.ssh/k3s_ec2_key
          ssh-keyscan -H "$K3S_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apontar manifesto para a imagem publicada no GHCR
        run: sed -i "s|$IMAGE_NAME:.*|$IMAGE_NAME:${{ github.sha }}|" k8s/deployment.yaml

      - name: Gerar Secret de producao - k8s/secret.yaml e so o valor de demo/CI
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          PROD_JWT_SECRET_KEY: ${{ secrets.PROD_JWT_SECRET_KEY }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl create secret generic oficina-billing-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=ConnectionStrings__DefaultConnection="$PROD_DB_CONNECTION_STRING" \
            --from-literal=Jwt__SecretKey="$PROD_JWT_SECRET_KEY" \
            --from-literal=RabbitMq__Password="$RABBITMQ_PASSWORD" \
            --from-literal=MercadoPago__AccessToken="$MERCADO_PAGO_ACCESS_TOKEN" \
            --from-literal=MercadoPago__NotificationUrl="http://$K3S_HOST/api/pagamentos/webhook" \
            --from-literal=NewRelic__LicenseKey="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml > /tmp/prod-secret.yaml

      - name: Copiar manifestos (exceto secret de demo e k8s/ci) e o secret de producao para o node k3s
        run: |
          ssh -i ~/.ssh/k3s_ec2_key "ubuntu@$K3S_HOST" "rm -rf /tmp/oficina-billing-k8s && mkdir -p /tmp/oficina-billing-k8s"
          scp -i ~/.ssh/k3s_ec2_key $(ls k8s/*.yaml | grep -v '/secret\.yaml$') "ubuntu@$K3S_HOST:/tmp/oficina-billing-k8s/"
          scp -i ~/.ssh/k3s_ec2_key /tmp/prod-secret.yaml "ubuntu@$K3S_HOST:/tmp/oficina-billing-k8s/secret.yaml"

      - name: Aplicar manifestos no k3s e aguardar rollout
        run: |
          ssh -i ~/.ssh/k3s_ec2_key "ubuntu@$K3S_HOST" "
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /tmp/oficina-billing-k8s/
            kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=240s
          "

      - name: Smoke test via API Gateway (Traefik)
        # HTTP sem TLS: ambiente academico sem dominio/certificado (Sonar S5332 aceito como Safe)
        run: curl -sf --retry 6 --retry-delay 10 "http://$K3S_HOST/billing/swagger/v1/swagger.json" > /dev/null
